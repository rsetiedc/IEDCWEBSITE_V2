<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RSET IEDC and IIC RSET</title>
    <script>
      // GitHub Pages does not serve index.html for unknown paths, so refreshing
      // or directly visiting a route like /events returns a 404. This file
      // redirects to the app entry while preserving the original path via the
      // ?p= query parameter, which App.jsx restores with the router.
      (function () {
        // Site is served from the domain root, so deep-link routes like
        // /events are preserved as-is and restored by App.jsx via ?p=.
        var path = location.pathname || "/";
        location.replace("/?p=" + encodeURIComponent(path));
      })();
    </script>
  </head>
  <body>
    Redirecting to RSET IEDC&hellip;
  </body>
</html>
