name: Deploy Vite to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    environment: github-pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate events snapshot
        run: node scripts/generateEventsJson.mjs
        env:
          VITE_BASEROW_API_URL: ${{ secrets.VITE_BASEROW_API_URL }}
          VITE_BASEROW_TOKEN: ${{ secrets.VITE_BASEROW_TOKEN }}
          VITE_BASEROW_TABLE_ID: ${{ secrets.VITE_BASEROW_TABLE_ID }}

      - name: Verify events snapshot
        run: |
          COUNT=$(node --input-type=module -e "import { readFileSync } from 'node:fs'; const e = JSON.parse(readFileSync('./public/events.json', 'utf8')); console.log(e.length)")
          echo "events.json contains $COUNT events"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::events.json is EMPTY. Add the VITE_BASEROW_TOKEN and VITE_BASEROW_TABLE_ID secrets under repo Settings -> Secrets and variables -> Actions (or commit a populated public/events.json)."
            exit 1
          fi

      - name: Build project
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
